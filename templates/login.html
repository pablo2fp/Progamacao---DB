<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f7f6; }
        form { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        .senha { display: flex; gap: 8px; }
        .senha input { flex: 1; }
        .senha button { white-space: nowrap; }
        button { background-color: #007bff; color: white; padding: 10px; border: 0; border-radius: 4px; cursor: pointer; }
        li { color: #b00020; }
    </style>
</head>
<body>
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <h1>Entrar</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<ul>{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
        {% endwith %}
        <label for="username">Usuário</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Senha</label>
        <div class="senha">
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button type="button" class="mostrar-senha" aria-pressed="false">Mostrar</button>
        </div>
        <button type="submit">Entrar</button>
        <p><a href="{{ url_for('recuperar_senha') }}">Esqueci minha senha</a></p>
        <p>Não tem conta? <a href="{{ url_for('register') }}">Criar uma conta</a></p>
    </form>
    <script>
        document.querySelectorAll('.mostrar-senha').forEach((button) => {
            button.addEventListener('click', () => {
                const password = button.parentElement.querySelector('input');
                const visible = password.type === 'password';
                password.type = visible ? 'text' : 'password';
                button.textContent = visible ? 'Ocultar' : 'Mostrar';
                button.setAttribute('aria-pressed', String(visible));
            });
        });
    </script>
</body>
</html>
